<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Harum Market</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧊</text></svg>">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Login -->
  <section id="login-view" class="login" hidden>
    <form id="login-form" class="login-card">
      <div class="logo-big">🧊</div>
      <h1>Harum Market</h1>
      <p class="muted">Panel Admin</p>
      <label>Email<input name="login" type="email" required autocomplete="username" placeholder="admin@harumgroup.id"></label>
      <label>Kata sandi
        <span class="pw-wrap"><input name="password" type="password" required autocomplete="current-password">
          <button type="button" class="pw-toggle" aria-label="Lihat kata sandi" title="Lihat kata sandi"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></span></label>
      <p class="error" id="login-error"></p>
      <button class="btn primary block" type="submit">Masuk</button>
    </form>
  </section>

  <!-- App -->
  <div id="app-view" class="layout" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-icon">🧊</span><div><b>Harum Market</b><small>Panel Admin</small></div></div>
      <nav id="nav">
        <a href="#/dashboard" data-page="dashboard">📊 Dashboard</a>
        <a href="#/orders" data-page="orders">🧾 Pesanan <span class="pill" id="pending-badge" hidden></span></a>
        <a href="#/products" data-page="products">📦 Sub Menu & Stok</a>
        <a href="#/categories" data-page="categories">🗂️ Kategori</a>
        <a href="#/banners" data-page="banners">🖼️ Banner Promo</a>
        <a href="#/expenses" data-page="expenses">💸 Biaya Operasional</a>
        <a href="#/customers" data-page="customers">👥 Pelanggan</a>
        <a href="#/reports" data-page="reports">📑 Laporan</a>
        <a href="#/data" data-page="data">🛡️ Data & Backup</a>
        <a href="#/settings" data-page="settings">⚙️ Pengaturan</a>
      </nav>
      <button class="btn ghost block" data-logout>Keluar</button>
    </aside>
    <div class="backdrop" id="backdrop" hidden></div>
    <main>
      <header class="topbar">
        <button class="icon-btn" id="menu-toggle" aria-label="Menu">☰</button>
        <h2 id="page-title">Dashboard</h2>
        <span class="live" id="live" title="Sinkronisasi realtime">● Live</span>
        <span class="muted admin-name" id="admin-name"></span>
        <button class="btn sm logout-top" data-logout title="Keluar dari panel admin">Keluar</button>
      </header>
      <div id="page" class="page"></div>
    </main>
  </div>

  <div id="modal" class="modal" hidden><div class="modal-card" id="modal-card"></div></div>
  <div id="toast" class="toast" hidden></div>
  <script src="/vendor/chart.umd.js"></script>
  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
